name: "Handle Fix Commit"
description: "Commits changes if possible, otherwise creates a patch and comments on the PR."

outputs:
  changes:
    description: "Whether changes were detected"
    value: ${{ steps.check_changes.outputs.changes }}
  pushed:
    description: "Whether changes were pushed"
    value: ${{ steps.commit_and_push.outputs.pushed }}
  commit_sha:
    description: "The full SHA of the pushed commit"
    value: ${{ steps.commit_and_push.outputs.commit_sha }}
  commit_sha_short:
    description: "The short SHA of the pushed commit"
    value: ${{ steps.commit_and_push.outputs.commit_sha_short }}
  patch_name:
    description: "The name of the patch file if created"
    value: ${{ steps.commit_and_push.outputs.patch_name || steps.create_patch.outputs.patch_name }}

inputs:
  tool:
    description: "The tool name reported in commit messages and PR comments."
    required: true
  working-directory:
    description: "The working directory for git operations."
    required: false
    default: "phlex-src"
  token:
    description: "The PAT to use for committing."
    required: true
  pr-info-ref:
    description: "The ref (branch name) of the PR"
    required: true
  pr-info-repo:
    description: "The repository of the PR"
    required: true
  pr-info-sha:
    description: "Caller-approved full source SHA; missing approval permits patch generation only"
    required: false
    default: ""
  retry-attempts:
    description: "The number of times to retry pushing the commit."
    required: false
    default: "6"
  skip-comment:
    description: "Skip posting PR comments (for workflow_call usage)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Check for changes
      id: check_changes
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ -n $(git -c core.fsmonitor=false status --porcelain) ]]; then
          echo "changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: No changes to apply
      if: steps.check_changes.outputs.changes == 'false' && inputs.skip-comment != 'true'
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      with:
        message: "No automatic ${{ inputs.tool }} fixes were necessary."

    - name: Get PR maintainer_can_modify property
      id: pr-properties
      if: steps.check_changes.outputs.changes == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_REPO: ${{ inputs.pr-info-repo }}
        PR_REF: ${{ inputs.pr-info-ref }}
        PR_SHA: ${{ inputs.pr-info-sha }}
      with:
        script: |
          // context.issue.number is only available when the root trigger is an
          // issue_comment event. For workflow_dispatch triggers (and any other
          // non-PR-comment trigger), default to false so the commit path still
          // works for same-repo pushes via the first clause of the commit condition.
          const prNumber = context.issue.number;
          if (!prNumber) {
            core.setOutput('maintainer_can_modify', 'false');
            return;
          }
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber
          });
          const targetMatches = pr.head.repo?.full_name === process.env.PR_REPO &&
            pr.head.ref === process.env.PR_REF && pr.head.sha === process.env.PR_SHA;
          core.setOutput('maintainer_can_modify', targetMatches && pr.maintainer_can_modify);
    - name: Commit fixes
      if: >-
        steps.check_changes.outputs.changes == 'true' && (inputs.pr-info-repo == github.repository ||
        steps.pr-properties.outputs.maintainer_can_modify == 'true')
      id: commit_and_push
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOL: ${{ inputs.tool }}
        TOKEN: ${{ inputs.token }}
        PR_REF: ${{ inputs.pr-info-ref }}
        PR_REPO: ${{ inputs.pr-info-repo }}
        PR_SHA: ${{ inputs.pr-info-sha }}
        RETRY_ATTEMPTS: ${{ inputs.retry-attempts }}
      run: |
        python3 "$GITHUB_ACTION_PATH/handle_fix_commit.py"

    - name: Notify of commit
      if:
        steps.commit_and_push.conclusion == 'success' && steps.commit_and_push.outputs.pushed == 'true' &&
        inputs.skip-comment != 'true'
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      with:
        # yamllint disable rule:line-length
        message: |
          Automatic ${{ inputs.tool }} fixes pushed (commit ${{ steps.commit_and_push.outputs.commit_sha_short || steps.commit_and_push.outputs.commit_sha }}).
          ⚠️ **Note:** Some issues may require manual review and fixing.
        # yamllint enable

    - name: Create patch
      if: >-
        steps.check_changes.outputs.changes == 'true' && inputs.pr-info-repo != github.repository &&
        steps.pr-properties.outputs.maintainer_can_modify != 'true'
      id: create_patch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOL: ${{ inputs.tool }}
        PR_REF: ${{ inputs.pr-info-ref }}
        PR_REPO: ${{ inputs.pr-info-repo }}
        PR_SHA: ${{ inputs.pr-info-sha }}
        RETRY_ATTEMPTS: ${{ inputs.retry-attempts }}
        PATCH_ONLY: "true"
      run: |
        python3 "$GITHUB_ACTION_PATH/handle_fix_commit.py"

    - name: Upload patch
      if: steps.commit_and_push.outputs.patch_name || steps.create_patch.outputs.patch_name
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fix-patch
        path: ${{ inputs.working-directory }}/${{ steps.commit_and_push.outputs.patch_name || steps.create_patch.outputs.patch_name }}

    - name: Comment with patch instructions
      if: (steps.commit_and_push.outputs.patch_name || steps.create_patch.outputs.patch_name) && inputs.skip-comment != 'true'
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      with:
        # yamllint disable rule:line-length
        message: |
          Automatic fixes are available as a patch because write access, immutable approval, or the unchanged target snapshot could not be confirmed.
          Please apply the patch below to fix the issues:
          1. **Download the patch file:** You can download the patch from the "Artifacts" section of this workflow run.
          2. **Apply the patch:**
             ```bash
             git apply <path/to/downloaded/fix.patch>
             ```
          3. **Commit the changes:**
             ```bash
             git commit -am "Apply ${{ inputs.tool }} fixes"
             ```
        # yamllint enable
